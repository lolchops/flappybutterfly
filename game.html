<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Our Flappy Game</title>
<style>
  body { margin: 0; background: #222; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: white; }
  canvas { background: #7ec8f0; margin-top: 20px; border-radius: 8px; touch-action: none; }
  #game-area { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px; }
  #game-col { display: flex; flex-direction: column; align-items: center; }
  #gear { margin-top: 20px; font-size: 18px; padding: 8px 16px; border-radius: 20px; border: none;
          background: #ffd84d; color: #222; font-weight: bold; cursor: pointer; }
  #settings { display: none; margin-top: 20px; background: #333; border-radius: 12px; padding: 16px 20px; width: 300px; }
  #settings.open { display: block; }
  #settings h2 { margin: 0 0 12px; font-size: 22px; }
  .knob { margin-bottom: 14px; }
  .knob label { display: flex; justify-content: space-between; font-size: 16px; }
  .knob .val { color: #ffd84d; font-weight: bold; }
  .knob input { width: 100%; accent-color: #ffd84d; }
  .knob .hint { font-size: 13px; color: #aaa; }
  #reset { width: 100%; padding: 8px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; }
</style>
</head>
<body>

<button id="gear">⚙️ Settings</button>

<div id="game-area">
  <div id="game-col">
    <canvas id="screen" width="400" height="600"></canvas>
  </div>
  <!-- The settings panel: sliders that change the knobs while you play -->
  <div id="settings">
    <h2>⚙️ Settings</h2>
    <div id="knobs"></div>
    <button id="reset">↩️ Back to normal</button>
  </div>
</div>

<script>
// ============================================================
//  KNOBS TO PLAY WITH!
//  Change a number, save, and refresh the page to see what happens.
// ============================================================

let GRAVITY        = 0.4;  // how hard the butterfly gets pulled down
let FLAP_POWER     = -7;   // how high one flap pushes you (negative = UP)
let BIRD_SIZE      = 70;   // how big the butterfly is
let WING_FLAP      = 0.75; // how far the wings fold on each flap (0 to 1)

let FLOWER_SIZE    = 120;  // how wide the flowers are
let GAP            = 200;  // space between the top and bottom flowers (smaller = harder!)
let FLOWER_SPEED   = 2.5;  // how fast the flowers slide by
let FLOWER_SPACING = 240;  // distance from one pair of flowers to the next
let WATER_SPEED    = 1.5;  // how fast the watering can pours

// ============================================================
//  STEP 2: Her drawings!
// ============================================================

function picture(file) { const img = new Image(); img.src = "assets/" + file; return img; }

// The butterfly, cut into two pieces so the wings can move by themselves
const wings = picture("butterfly-wings.png");
const body  = picture("butterfly-body.png");

// Where her butterfly's eyes are in the drawing (measured by the computer, in dots)
const EYES = [
  { x: 416, y: 156, rx: 37, ry: 40 },   // left eye
  { x: 525, y: 179, rx: 41, ry: 31 }    // right eye
];
const DRAWING_W = 600, DRAWING_H = 422;
const LID_COLOR = "rgb(109,103,90)";    // same gray she colored the head

// STEP 3: The flower obstacles. The computer measured where each
// flower's head and stem are, so it knows when the butterfly bumps one.
const OBSTACLES = [
  { img: picture("flower-red.png"),    w: 300, h: 430, stemX0: 79, stemX1: 188, headBottom: 266 },
  { img: picture("flower-purple.png"), w: 300, h: 396, stemX0: 71, stemX1: 158, headBottom: 259 },
  { img: picture("flower-orange.png"), w: 300, h: 563, stemX0: 52, stemX1: 197, headBottom: 270 },
];

// STEP 5: The watering can! It only hangs from the top, and slowly pours
// water down to the middle of the screen. (Measured in dots of her drawing.)
const CAN = {
  img: picture("watering-can.png"), w: 600, h: 389,
  parts: [                  // the pieces the butterfly can bump: [left, top, right, bottom]
    [285,   0, 585, 215],   // the can
    [290, 215, 555, 385],   // the handle
    [ 95, 110, 290, 230],   // the spout
    [ 10,  55, 150, 355],   // the water she drew coming out of the spout
  ],
  streamX0: 50, streamX1: 140, streamTop: 320,   // where the poured water comes out
};
const CAN_CHANCE = 0.25;    // 1 out of every 4 tops is a watering can
const WATER_BLUE = "rgb(8,32,115)";   // the same blue she used for water
function canWidth() { return FLOWER_SIZE * 2; }
function columnWidth(f) { return f.can ? canWidth() : FLOWER_SIZE; }

// ============================================================

const screen = document.getElementById("screen");
const pen = screen.getContext("2d");   // the "pen" draws on the screen
const W = screen.width, H = screen.height;

// The butterfly. The computer remembers where it is and how fast it's moving.
const bird = { x: 110, y: 300, speed: 0 };

let mode = "ready";       // "ready" (waiting to start), "playing", or "over"
let flowers = [];         // the flowers on the screen right now
let score = 0;
let best = 0;
try { best = Number(localStorage.getItem("flappy-best")) || 0; } catch (e) {}
let overTime = 0;

let wingTimer = 0, clock = 0, nextBlink = 120, blinkTimer = 0;

// ------------------------------------------------------------
//  Pressing SPACE, clicking, or tapping
// ------------------------------------------------------------
function press() {
  if (mode === "ready") { mode = "playing"; }
  if (mode === "over") {
    if (clock - overTime < 40) return;   // tiny pause so you don't restart by accident
    restart();
    return;
  }
  bird.speed = FLAP_POWER;
  wingTimer = 12;   // one wing flap lasts 12 pictures (1/5 of a second!)
}
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); press(); } });
screen.addEventListener("mousedown", press);
screen.addEventListener("touchstart", e => { e.preventDefault(); press(); });

function restart() {
  bird.y = 300; bird.speed = 0;
  flowers = []; score = 0;
  mode = "ready";
}

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

function addFlowers() {
  const margin = 70;
  const hasCan = Math.random() < CAN_CHANCE;
  let gapMiddle = margin + GAP / 2 + Math.random() * (H - 2 * margin - GAP);
  if (hasCan) gapMiddle = H / 2 + GAP / 2;   // the water stops halfway down; the gap is just below it
  flowers.push({
    x: W,
    gapTop: gapMiddle - GAP / 2,
    gapBottom: gapMiddle + GAP / 2,
    top: pick(OBSTACLES),
    bottom: pick(OBSTACLES),
    can: hasCan,
    pour: 0,          // how far the water has poured so far
    drops: [],        // little splashing water drops
    passed: false
  });
}

// Is the circle (px, py, r) touching the rectangle?
function hitsBox(px, py, r, x0, y0, x1, y1) {
  const nx = Math.max(x0, Math.min(px, x1)), ny = Math.max(y0, Math.min(py, y1));
  return (px - nx) ** 2 + (py - ny) ** 2 < r * r;
}

// Did the butterfly bump the watering can, or its water?
function bumpsCan(f, lx, ly, r) {
  const s = canWidth() / CAN.w;
  for (const [x0, y0, x1, y1] of CAN.parts) {
    if (hitsBox(lx, ly, r, x0 * s, y0 * s, x1 * s, y1 * s)) return true;
  }
  const top = CAN.streamTop * s;
  return f.pour > 0 && hitsBox(lx, ly, r, CAN.streamX0 * s, top, CAN.streamX1 * s, top + f.pour);
}

// ------------------------------------------------------------
//  Did the butterfly bump this flower?
//  (lx, ly) is the butterfly's spot measured from the flower's head
// ------------------------------------------------------------
function bumps(o, lx, ly, r) {
  const s = FLOWER_SIZE / o.w;
  // the flower head is (about) an oval
  const cx = o.w / 2 * s, cy = o.headBottom / 2 * s;
  const rx = o.w / 2 * s * 0.85, ry = o.headBottom / 2 * s * 0.85;
  if (((lx - cx) / (rx + r)) ** 2 + ((ly - cy) / (ry + r)) ** 2 < 1) return true;
  // the stem is a long rectangle
  const nearX = Math.max(o.stemX0 * s, Math.min(lx, o.stemX1 * s));
  const nearY = Math.max(cy, ly);
  return (lx - nearX) ** 2 + (ly - nearY) ** 2 < r * r;
}

// ------------------------------------------------------------
//  Move everything one tiny step (60 times every second)
// ------------------------------------------------------------
function update() {
  clock++;
  const r = BIRD_SIZE * 0.3;   // the butterfly's "bump circle"

  if (mode === "ready") {
    bird.y = 300 + Math.sin(clock * 0.08) * 12;   // float gently while waiting
    return;
  }
  if (mode === "over") return;

  // 1. Gravity pulls the butterfly down
  bird.speed += GRAVITY;
  bird.y += bird.speed;
  if (bird.y < r) { bird.y = r; bird.speed = 0; }

  // 2. Slide the flowers left, and add new ones
  for (const f of flowers) f.x -= FLOWER_SPEED;
  flowers = flowers.filter(f => f.x > -columnWidth(f));
  const last = flowers[flowers.length - 1];
  if (!last || last.x + columnWidth(last) < W - (FLOWER_SPACING - FLOWER_SIZE)) addFlowers();

  // 3. The watering cans pour, a little more each step, until the water is halfway down
  for (const f of flowers) {
    if (!f.can) continue;
    const s = canWidth() / CAN.w;
    f.pour = Math.min(f.pour + WATER_SPEED, H / 2 - CAN.streamTop * s);
    // splashy drops fall off the end of the water
    if (f.pour > 0 && Math.random() < 0.5) {
      f.drops.push({ x: (CAN.streamX0 + Math.random() * (CAN.streamX1 - CAN.streamX0)) * s,
                     y: CAN.streamTop * s + f.pour, speed: 1 + Math.random() * 2, age: 0 });
    }
    for (const d of f.drops) { d.y += d.speed; d.speed += 0.3; d.age++; }
    f.drops = f.drops.filter(d => d.age < 15);
  }

  // 4. Score a point for each pair you get past
  for (const f of flowers) {
    if (!f.passed && f.x + columnWidth(f) < bird.x) { f.passed = true; score++; }
  }

  // 5. Crash checks: the ground, then every flower and watering can
  let crashed = bird.y > H - r;
  for (const f of flowers) {
    const lx = bird.x - f.x;
    if (bumps(f.bottom, lx, bird.y - f.gapBottom, r)) crashed = true;   // flower growing up
    if (f.can) {
      if (bumpsCan(f, lx, bird.y, r)) crashed = true;                   // watering can and its water
    } else {
      if (bumps(f.top, lx, f.gapTop - bird.y, r)) crashed = true;       // flower hanging down
    }
  }
  if (crashed) {
    mode = "over";
    overTime = clock;
    if (score > best) { best = score; try { localStorage.setItem("flappy-best", best); } catch (e) {} }
  }
}

// ------------------------------------------------------------
//  Drawing
// ------------------------------------------------------------

// Draws a flower growing DOWN from (0,0), with its stem stretched to "length"
function drawFlower(o, length) {
  if (!o.img.complete) return;
  const s = FLOWER_SIZE / o.w;
  const fh = o.h * s;
  pen.drawImage(o.img, 0, 0, FLOWER_SIZE, fh);
  if (length > fh) {
    // stretch a slice of the stem to reach the edge of the screen
    pen.drawImage(o.img, 0, o.h - 40, o.w, 35, 0, fh - 2, FLOWER_SIZE, length - fh + 2);
  }
}

// Draws the watering can at the top of the screen, pouring its water
function drawCan(f) {
  const s = canWidth() / CAN.w;
  pen.save();
  pen.translate(f.x, 0);
  if (CAN.img.complete) pen.drawImage(CAN.img, 0, 0, CAN.w * s, CAN.h * s);

  if (f.pour > 0) {
    const x0 = CAN.streamX0 * s, x1 = CAN.streamX1 * s;
    const top = CAN.streamTop * s, end = top + f.pour;
    // The water's edges wiggle, and it gets a bit skinnier as it falls
    const left = [], right = [];
    for (let y = top; y < end; y += 4) left.push(y);
    left.push(end);
    const edge = (y, side) => {
      const wiggle = Math.sin(y * 0.12 - clock * 0.3) * 1.5;
      const skinny = (x1 - x0) * 0.2 * ((y - top) / (H / 2));
      return side < 0 ? x0 + skinny + wiggle : x1 - skinny + wiggle;
    };
    const bottomL = edge(end, -1), bottomR = edge(end, 1);
    pen.beginPath();
    left.forEach((y, i) => i ? pen.lineTo(edge(y, -1), y) : pen.moveTo(edge(y, -1), y));
    pen.quadraticCurveTo((bottomL + bottomR) / 2, end + (bottomR - bottomL) * 0.7, bottomR, end);
    for (let i = left.length - 1; i >= 0; i--) pen.lineTo(edge(left[i], 1), left[i]);
    pen.closePath();
    pen.fillStyle = WATER_BLUE;
    pen.fill();

    // black outline on the sides (starting below her drawn water) and the rounded bottom
    pen.strokeStyle = "black";
    pen.lineWidth = 2;
    const outlineFrom = 362 * s;
    for (const side of [-1, 1]) {
      pen.beginPath();
      left.filter(y => y >= outlineFrom).forEach((y, i) => i ? pen.lineTo(edge(y, side), y) : pen.moveTo(edge(y, side), y));
      pen.stroke();
    }
    pen.beginPath();
    pen.moveTo(bottomL, end);
    pen.quadraticCurveTo((bottomL + bottomR) / 2, end + (bottomR - bottomL) * 0.7, bottomR, end);
    pen.stroke();

    // shiny streaks sliding down so it looks like it's flowing
    pen.strokeStyle = "rgba(140,180,255,0.7)";
    pen.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const y = top + (clock * 3 + i * 23) % Math.max(1, f.pour);
      if (y + 10 > end) continue;
      const x = x0 + (x1 - x0) * (0.3 + 0.4 * ((i * 37) % 10) / 10);
      pen.beginPath(); pen.moveTo(x, y); pen.lineTo(x, y + 10); pen.stroke();
    }

    // splashing drops
    pen.fillStyle = WATER_BLUE;
    for (const d of f.drops) {
      pen.globalAlpha = 1 - d.age / 15;
      pen.beginPath(); pen.arc(d.x, d.y, 2.5, 0, Math.PI * 2); pen.fill();
    }
    pen.globalAlpha = 1;
  }
  pen.restore();
}

function drawButterfly() {
  // It tips up when flying up, and nose-down when falling
  const tilt = mode === "ready" ? 0 : Math.max(-0.5, Math.min(0.8, bird.speed * 0.06));
  const w = BIRD_SIZE * 1.4;
  const h = w * DRAWING_H / DRAWING_W;

  // How open are the wings right now? (1 = wide open)
  let wingOpen = 1 - 0.1 * (0.5 + 0.5 * Math.sin(clock * 0.2));   // gentle flutter
  if (wingTimer > 0) {
    wingOpen = 1 - WING_FLAP * Math.sin(Math.PI * wingTimer / 12); // big flap
    wingTimer--;
  }

  pen.save();
  pen.translate(bird.x, bird.y);
  pen.rotate(tilt);
  if (wings.complete) {
    pen.save();
    pen.scale(1, wingOpen);   // squish the wings toward the body
    pen.drawImage(wings, -w / 2, -h / 2, w, h);
    pen.restore();
  }
  if (body.complete) pen.drawImage(body, -w / 2, -h / 2, w, h);

  // Blink every 2 to 5 seconds (the computer picks a random time)
  nextBlink--;
  if (nextBlink <= 0) { blinkTimer = 10; nextBlink = 120 + Math.random() * 180; }
  if (mode === "over") blinkTimer = 5;   // eyes squeezed shut after a crash
  if (blinkTimer > 0) {
    const closed = Math.sin(Math.PI * blinkTimer / 10);   // 0 = open, 1 = shut
    if (mode !== "over") blinkTimer--;
    for (const eye of EYES) {
      const ex = (eye.x / DRAWING_W - 0.5) * w, ey = (eye.y / DRAWING_H - 0.5) * h;
      const erx = eye.rx / DRAWING_W * w, ery = eye.ry / DRAWING_H * h;
      const lidBottom = ey - ery + 2 * ery * closed;
      pen.save();
      pen.beginPath();
      pen.ellipse(ex, ey, erx, ery, 0, 0, Math.PI * 2);
      pen.clip();
      pen.fillStyle = LID_COLOR;
      pen.fillRect(ex - erx, ey - ery - 1, erx * 2, lidBottom - (ey - ery) + 1);
      pen.restore();
      pen.strokeStyle = "black";
      pen.lineWidth = Math.max(1.5, w / 60);
      pen.beginPath();
      pen.ellipse(ex, lidBottom - ery * 0.3 * closed, erx * 0.95, ery * 0.3 * closed + 0.01, 0, 0.15 * Math.PI, 0.85 * Math.PI);
      pen.stroke();
    }
  }
  pen.restore();
}

function bigText(text, y, size) {
  pen.font = `bold ${size}px sans-serif`;
  pen.textAlign = "center";
  pen.lineWidth = size / 6;
  pen.strokeStyle = "black";
  pen.fillStyle = "white";
  pen.strokeText(text, W / 2, y);
  pen.fillText(text, W / 2, y);
}

function draw() {
  pen.clearRect(0, 0, W, H);

  for (const f of flowers) {
    // bottom flower: grows up from the ground
    pen.save();
    pen.translate(f.x, f.gapBottom);
    drawFlower(f.bottom, H - f.gapBottom);
    pen.restore();
    if (f.can) {
      drawCan(f);
    } else {
      // top flower: flipped upside down, hanging from the sky
      pen.save();
      pen.translate(f.x, f.gapTop);
      pen.scale(1, -1);
      drawFlower(f.top, f.gapTop);
      pen.restore();
    }
  }

  drawButterfly();

  if (mode === "ready") {
    bigText("Ready?", 170, 56);
    bigText("Press SPACE or tap to fly!", 470, 24);
  } else {
    bigText(score, 80, 64);
  }
  if (mode === "over") {
    bigText("Oh no!", 230, 60);
    bigText(`Score: ${score}    Best: ${best}`, 290, 28);
    if (clock - overTime >= 40) bigText("Press SPACE to play again", 470, 24);
  }
}

// ------------------------------------------------------------
//  The settings screen: a slider for each knob.
//  Moving a slider changes the number while the game is running!
// ------------------------------------------------------------
const KNOBS = [
  { label: "🌍 Gravity", min: 0.1, max: 1.2, step: 0.05, get: () => GRAVITY, set: v => GRAVITY = v,
    hint: v => v < 0.2 ? "Floaty like the Moon 🌙" : v < 0.55 ? "Normal, like Earth" : v < 0.9 ? "Heavy!" : "Jupiter! 🪐" },
  { label: "💪 Flap strength", min: 3, max: 15, step: 0.5, get: () => -FLAP_POWER, set: v => FLAP_POWER = -v,
    hint: v => v < 5 ? "Tiny flaps" : v < 10 ? "Normal flaps" : "SUPER flaps!" },
  { label: "🦋 Butterfly size", min: 30, max: 150, step: 5, get: () => BIRD_SIZE, set: v => BIRD_SIZE = v,
    hint: v => v < 50 ? "Teeny tiny" : v < 100 ? "Just right" : "GIANT butterfly!" },
  { label: "🪽 Wing flap", min: 0, max: 1, step: 0.05, get: () => WING_FLAP, set: v => WING_FLAP = v,
    hint: v => v < 0.2 ? "Barely moving" : v < 0.8 ? "Normal flapping" : "Wings fold all the way" },
  { label: "🌸 Flower size", min: 60, max: 200, step: 5, get: () => FLOWER_SIZE, set: v => FLOWER_SIZE = v,
    hint: v => v < 90 ? "Little sprouts" : v < 150 ? "Normal flowers" : "Huge flowers!" },
  { label: "↕️ Gap size", min: 120, max: 350, step: 5, get: () => GAP, set: v => GAP = v,
    hint: v => v < 170 ? "Really hard!" : v < 240 ? "Normal" : "Easy peasy" },
  { label: "💨 Flower speed", min: 1, max: 7, step: 0.25, get: () => FLOWER_SPEED, set: v => FLOWER_SPEED = v,
    hint: v => v < 2 ? "Slow and gentle" : v < 3.5 ? "Normal" : v < 5 ? "Fast!" : "SUPER FAST! 🚀" },
  { label: "📏 Flower spacing", min: 150, max: 400, step: 10, get: () => FLOWER_SPACING, set: v => FLOWER_SPACING = v,
    hint: v => v < 200 ? "Packed close together" : v < 300 ? "Normal" : "Lots of room" },
  { label: "💧 Water pour speed", min: 0.25, max: 5, step: 0.25, get: () => WATER_SPEED, set: v => WATER_SPEED = v,
    hint: v => v < 1 ? "Slow drip" : v < 2.5 ? "Normal pour" : "Gushing! 🌊" },
];
const NORMAL = KNOBS.map(k => k.get());   // remember the starting numbers for "Back to normal"

function saveKnobs() {
  try { localStorage.setItem("flappy-knobs", JSON.stringify(KNOBS.map(k => k.get()))); } catch (e) {}
}
try {   // load the settings from last time, if there are any
  const saved = JSON.parse(localStorage.getItem("flappy-knobs"));
  if (Array.isArray(saved)) saved.slice(0, KNOBS.length).forEach((v, i) => { if (typeof v === "number") KNOBS[i].set(v); });
} catch (e) {}

const knobsBox = document.getElementById("knobs");
for (const k of KNOBS) {
  const div = document.createElement("div");
  div.className = "knob";
  div.innerHTML = `<label><span>${k.label}</span><span class="val"></span></label>
    <input type="range" min="${k.min}" max="${k.max}" step="${k.step}"><div class="hint"></div>`;
  const slider = div.querySelector("input");
  k.show = () => {
    slider.value = k.get();
    div.querySelector(".val").textContent = +k.get().toFixed(2);
    div.querySelector(".hint").textContent = k.hint(k.get());
  };
  slider.addEventListener("input", () => { k.set(Number(slider.value)); k.show(); saveKnobs(); });
  k.show();
  knobsBox.appendChild(div);
}
document.getElementById("reset").addEventListener("click", () => {
  KNOBS.forEach((k, i) => { k.set(NORMAL[i]); k.show(); });
  saveKnobs();
});
document.getElementById("gear").addEventListener("click", e => {
  document.getElementById("settings").classList.toggle("open");
  e.target.blur();   // so SPACE flaps instead of clicking the button again
});

// ------------------------------------------------------------
//  The game loop: move things in steady 1/60-second steps
//  (so the game runs the same speed on every computer), then draw.
// ------------------------------------------------------------
let lastTime = performance.now(), leftover = 0;
function gameLoop(now) {
  leftover += Math.min(now - lastTime, 100);
  lastTime = now;
  while (leftover >= 1000 / 60) { update(); leftover -= 1000 / 60; }
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
