<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Our Flappy Game</title>
<style>
  body { margin: 0; background: #222; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: white; }
  canvas { background: #7ec8f0; margin-top: 20px; border-radius: 8px; }
  #brain { margin-top: 10px; font-size: 18px; text-align: center; line-height: 1.6; }
  #brain b { color: #ffd84d; }
</style>
</head>
<body>

<canvas id="screen" width="400" height="600"></canvas>

<!-- This box shows how hard the computer is working -->
<div id="brain"></div>

<script>
// ============================================================
//  STEP 1: A bird that falls... and flaps!
//  Try changing these numbers and refresh the page to see what happens.
// ============================================================

let GRAVITY    = 0.4;   // how hard the bird gets pulled down
let FLAP_POWER = -7;    // how high one flap pushes you (negative = UP)
let BIRD_SIZE  = 70;    // how big the butterfly is
let WING_FLAP  = 0.75;  // how far the wings fold on each flap (0 = not at all, 1 = all the way)

// STEP 2: Her drawing! The computer cut it into two pieces,
// the wings and the body, so the wings can move by themselves.
const wings = new Image();
wings.src = "assets/butterfly-wings.png";
const body = new Image();
body.src = "assets/butterfly-body.png";
let wingTimer = 0;      // counts down while the wings are doing a flap
let clock = 0;          // counts every picture, used for a gentle flutter

// ------------------------------------------------------------

const screen = document.getElementById("screen");
const pen = screen.getContext("2d");   // the "pen" draws on the screen

// Our bird. The computer remembers where it is and how fast it's moving.
const bird = {
  x: 100,
  y: 300,
  speed: 0
};

// Counters to show off how hard the computer is working
let picturesDrawn = 0;
let mathProblems = 0;
const startTime = Date.now();

// When you press SPACE or click, the bird flaps!
function flap() {
  bird.speed = FLAP_POWER;
  wingTimer = 12;   // one wing flap lasts 12 pictures (that's 1/5 of a second!)
}
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); flap(); } });
screen.addEventListener("mousedown", flap);
screen.addEventListener("touchstart", e => { e.preventDefault(); flap(); });

// This runs about 60 times EVERY SECOND.
function gameLoop() {
  // 1. Move the bird
  bird.speed = bird.speed + GRAVITY;   // gravity makes us fall faster and faster
  bird.y = bird.y + bird.speed;        // move by our speed
  mathProblems += 2;

  // 2. Don't fall off the bottom or fly off the top
  if (bird.y > screen.height - BIRD_SIZE / 2) { bird.y = screen.height - BIRD_SIZE / 2; bird.speed = 0; }
  if (bird.y < BIRD_SIZE / 2)                 { bird.y = BIRD_SIZE / 2;                 bird.speed = 0; }
  mathProblems += 4;

  // 3. Wipe the screen clean and draw everything again
  pen.clearRect(0, 0, screen.width, screen.height);

  // Our hero: the butterfly she drew!
  // It tips up when flying up, and nose-down when falling.
  const tilt = Math.max(-0.5, Math.min(0.8, bird.speed * 0.06));
  const w = BIRD_SIZE * 1.4;
  const h = w * body.height / body.width;

  // How open are the wings right now? (1 = wide open)
  clock++;
  let wingOpen = 1 - 0.1 * (0.5 + 0.5 * Math.sin(clock * 0.2));   // gentle flutter
  if (wingTimer > 0) {
    wingOpen = 1 - WING_FLAP * Math.sin(Math.PI * wingTimer / 12); // big flap: fold in, then back out
    wingTimer--;
  }
  mathProblems += 3;

  pen.save();
  pen.translate(bird.x, bird.y);
  pen.rotate(tilt);
  if (wings.complete) {
    pen.save();
    pen.scale(1, wingOpen);                       // squish the wings toward the body
    pen.drawImage(wings, -w / 2, -h / 2, w, h);
    pen.restore();
  }
  if (body.complete) pen.drawImage(body, -w / 2, -h / 2, w, h);   // body goes on top
  pen.restore();

  // Every pixel on the screen has to be colored in, every single frame
  picturesDrawn++;
  const pixelsColored = picturesDrawn * screen.width * screen.height;

  const seconds = Math.max(1, Math.round((Date.now() - startTime) / 1000));
  document.getElementById("brain").innerHTML =
    `🧠 The computer has drawn <b>${picturesDrawn.toLocaleString()}</b> pictures so far ` +
    `(about <b>${Math.round(picturesDrawn / seconds)}</b> every second!)<br>` +
    `🎨 It has colored in <b>${pixelsColored.toLocaleString()}</b> dots on the screen<br>` +
    `➗ It has solved <b>${mathProblems.toLocaleString()}</b> math problems just to move the bird`;

  // 4. Do it all again, super fast
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
