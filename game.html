<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Our Flappy Game</title>
<style>
  body { margin: 0; background: #222; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: white; }
  canvas { background: #7ec8f0; margin-top: 20px; border-radius: 8px; touch-action: none; }
  #game-area { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px; }
  #game-col { display: flex; flex-direction: column; align-items: center; }
  #gear { margin-top: 20px; font-size: 18px; padding: 8px 16px; border-radius: 20px; border: none;
          background: #ffd84d; color: #222; font-weight: bold; cursor: pointer; }
  #settings { display: none; margin-top: 20px; background: #333; border-radius: 12px; padding: 16px 20px; width: 300px; }
  #settings.open { display: block; }
  #settings h2 { margin: 0 0 12px; font-size: 22px; }
  .knob { margin-bottom: 14px; }
  .knob label { display: flex; justify-content: space-between; font-size: 16px; }
  .knob .val { color: #ffd84d; font-weight: bold; }
  .knob input { width: 100%; accent-color: #ffd84d; }
  .knob .hint { font-size: 13px; color: #aaa; }
  #reset { width: 100%; padding: 8px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; }
</style>
</head>
<body>

<button id="gear">⚙️ Settings</button>

<div id="game-area">
  <div id="game-col">
    <canvas id="screen" width="400" height="600"></canvas>
  </div>
  <!-- The settings panel: sliders that change the knobs while you play -->
  <div id="settings">
    <h2>⚙️ Settings</h2>
    <div id="knobs"></div>
    <button id="reset">↩️ Back to normal</button>
  </div>
</div>

<script>
// ============================================================
//  KNOBS TO PLAY WITH!
//  Change a number, save, and refresh the page to see what happens.
// ============================================================

let GRAVITY        = 0.4;  // how hard the butterfly gets pulled down
let FLAP_POWER     = -7;   // how high one flap pushes you (negative = UP)
let BIRD_SIZE      = 70;   // how big the butterfly is
let WING_FLAP      = 0.75; // how far the wings fold on each flap (0 to 1)

let FLOWER_SIZE    = 120;  // how wide the flowers are
let GAP            = 200;  // space between the top and bottom flowers (smaller = harder!)
let FLOWER_SPEED   = 2.5;  // how fast the flowers slide by
let FLOWER_SPACING = 240;  // distance from one pair of flowers to the next
let WATER_SPEED    = 1.5;  // how fast the watering can pours
let CLOUD_SPEED    = 1;    // how fast the clouds drift (2 = twice as fast)
let POWER_SECONDS  = 10;   // how long the butterfly is invincible after 10 pollen

// ============================================================
//  STEP 2: Her drawings!
// ============================================================

function picture(file) { const img = new Image(); img.src = "assets/" + file; return img; }

// The butterfly, cut into two pieces so the wings can move by themselves
const wings = picture("butterfly-wings.png");
const body  = picture("butterfly-body.png");

// Where her butterfly's eyes are in the drawing (measured by the computer, in dots)
const EYES = [
  { x: 416, y: 156, rx: 37, ry: 40 },   // left eye
  { x: 525, y: 179, rx: 41, ry: 31 }    // right eye
];
const DRAWING_W = 600, DRAWING_H = 422;
const LID_COLOR = "rgb(109,103,90)";    // same gray she colored the head

// STEP 3: The flower obstacles. The computer measured where each
// flower's head and stem are, so it knows when the butterfly bumps one.
const OBSTACLES = [
  { img: picture("flower-red.png"),    w: 300, h: 430, stemX0: 79, stemX1: 188, headBottom: 266 },
  { img: picture("flower-purple.png"), w: 300, h: 396, stemX0: 71, stemX1: 158, headBottom: 259 },
  { img: picture("flower-orange.png"), w: 300, h: 563, stemX0: 52, stemX1: 197, headBottom: 270 },
];

// STEP 5: The watering can! It only hangs from the top, and slowly pours
// water down to the middle of the screen. (Measured in dots of her drawing.)
const CAN = {
  img: picture("watering-can.png"), w: 600, h: 389,
  parts: [                  // the pieces the butterfly can bump: [left, top, right, bottom]
    [285,   0, 585, 215],   // the can
    [290, 215, 555, 385],   // the handle
    [ 95, 110, 290, 230],   // the spout
    [ 10,  55, 150, 355],   // the water she drew coming out of the spout
  ],
  streamX0: 50, streamX1: 140, streamTop: 320,   // where the poured water comes out
};
const CAN_CHANCE = 0.25;    // 1 out of every 4 tops is a watering can
const WATER_BLUE = "rgb(8,32,115)";   // the same blue she used for water
function canWidth() { return FLOWER_SIZE * 2; }
function columnWidth(f) { return f.can ? canWidth() : FLOWER_SIZE; }

// STEP 6: Her background, in layers! Each layer moves at its own speed,
// and that's what makes the world look deep. It's called PARALLAX:
//   🌞 the sky and sun are SO far away they never move,
//   ☁️ the clouds drift slowly (big clouds are closer, so they go faster),
//   🌱 the grass slides by under the butterfly,
//   🌸 and the flowers, right in front, go fastest of all.
//
// STEP 8: Time of day! Every 10 flowers you pass, the world slowly
// changes to the next time of day. Each one has its own sky and land,
// and the clouds get tinted to match the light.
const SCENES = {
  sunrise: { sky: picture("sky-sunrise.png"), land: picture("land-sunrise.png"), landTop: 0,
             cloudTint: "rgba(255, 160, 170, 0.22)" },
  day:     { sky: picture("sky-day.png"), land: picture("grass-day.png"), landTop: 419.6,
             cloudTint: null },
  sunset:  { sky: picture("sky-sunset.png"), land: picture("land-sunset.png"), landTop: -54.5,
             cloudTint: "rgba(255, 130, 70, 0.3)" },
  // Night has no ground: her whole starry sky slowly scrolls by, and the stars twinkle.
  night:   { sky: picture("sky-night.png"), skySpeed: 0.25, land: null,
             cloudTint: "rgba(70, 60, 140, 0.45)",
             nightShade: "rgba(20, 10, 70, 0.3)",   // a dark blue blanket so the stars shine
             stars: [   // where each star is in her drawing (game pixels), so it can twinkle
               { img: picture("star-0.png"), x: 327.3, y: 58.5,  w: 195.5, h: 116.9 },
               { img: picture("star-1.png"), x: 534.3, y: 227.6, w: 165.8, h: 219.5 },
               { img: picture("star-2.png"), x: 148.6, y: 300.0, w: 156.2, h: 165.8 },
               { img: picture("star-4.png"), x: 571.0, y: 475.9, w: 215.2, h: 192.7 },
               { img: picture("moon-night.png"), x: 348.4, y: 329.7, w: 194.6, h: 271.2, still: true },
             ] },
};
const TIME_OF_DAY = ["sunrise", "day", "sunset", "night"];
let TIME_CHANGE_EVERY = 10;       // flowers to pass before the time of day changes
const FADE_FRAMES = 180;          // a change takes 3 seconds (180 pictures)
let sceneName = TIME_OF_DAY[0];
let scene = SCENES[sceneName];
let oldScene = null;              // the scene we're fading away from
let fade = 1;                     // 0 = just started changing, 1 = all done
const GRASS_PARALLAX = 0.6;       // the land moves at 6/10 of the flower speed
const CLOUD_PICS = [picture("cloud-big.png"), picture("cloud-small.png")];
let clouds = [];
let grassX = 0;                   // how far the grass has slid

// STEP 7: Pollen coins! Collect 10 to fill the box, and the butterfly
// becomes INVINCIBLE inside a glowing bubble. The box empties as time runs out.
const POLLEN = picture("pollen.png");
const POLLEN_W = 38, POLLEN_H = 38 * 110 / 160;
const POLLEN_NEEDED = 10;
let pollens = [];       // pollen coins on the screen right now
let pollenCount = 0;    // how many are in the box
let power = 0;          // pictures of invincibility left (60 every second)
let powerMax = 1;

// ============================================================

const screen = document.getElementById("screen");
const pen = screen.getContext("2d");   // the "pen" draws on the screen
const W = screen.width, H = screen.height;

// The butterfly. The computer remembers where it is and how fast it's moving.
const bird = { x: 110, y: 300, speed: 0 };

let mode = "ready";       // "ready" (waiting to start), "playing", or "over"
let flowers = [];         // the flowers on the screen right now
let score = 0;
let best = 0;
try { best = Number(localStorage.getItem("flappy-best")) || 0; } catch (e) {}
let overTime = 0;

let wingTimer = 0, clock = 0, nextBlink = 120, blinkTimer = 0;

// Munching! Where her butterfly's mouth is in the drawing, and how long a snack takes.
const MOUTH = { x: 443, y: 268, rx: 30, ry: 27 };
const EAT_FRAMES = 26;    // fly into the mouth, then 3 big bites
let munchTimer = 0;       // counts down while the mouth is chewing
let crumbs = [];          // little pollen crumbs that fall while she eats

// ------------------------------------------------------------
//  Pressing SPACE, clicking, or tapping
// ------------------------------------------------------------
function press() {
  if (mode === "ready") { mode = "playing"; }
  if (mode === "over") {
    if (clock - overTime < 40) return;   // tiny pause so you don't restart by accident
    restart();
    return;
  }
  bird.speed = FLAP_POWER;
  wingTimer = 12;   // one wing flap lasts 12 pictures (1/5 of a second!)
}
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); press(); } });
screen.addEventListener("mousedown", press);
screen.addEventListener("touchstart", e => { e.preventDefault(); press(); });

function restart() {
  bird.y = 300; bird.speed = 0;
  flowers = []; score = 0;
  pollens = []; pollenCount = 0; power = 0; crumbs = []; munchTimer = 0;
  if (sceneName !== TIME_OF_DAY[0]) changeScene(TIME_OF_DAY[0]);   // back to morning
  mode = "ready";
}

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

function addFlowers() {
  const margin = 70;
  const hasCan = Math.random() < CAN_CHANCE;
  let gapMiddle = margin + GAP / 2 + Math.random() * (H - 2 * margin - GAP);
  if (hasCan) gapMiddle = H / 2 + GAP / 2;   // the water stops halfway down; the gap is just below it
  flowers.push({
    x: W,
    gapTop: gapMiddle - GAP / 2,
    gapBottom: gapMiddle + GAP / 2,
    top: pick(OBSTACLES),
    bottom: pick(OBSTACLES),
    can: hasCan,
    pour: 0,          // how far the water has poured so far
    drops: [],        // little splashing water drops
    passed: false
  });

  // Put a pollen coin in the butterfly's path: either right in this gap,
  // or just past it, before the next flowers. (No pollen while invincible!)
  if (power > 0) return;
  const width = columnWidth(flowers[flowers.length - 1]);
  if (Math.random() < 0.5) {
    pollens.push({ x: W + width / 2, y: gapMiddle, got: 0 });
  } else {
    pollens.push({ x: W + width + (FLOWER_SPACING - FLOWER_SIZE) / 2, y: gapMiddle + (Math.random() - 0.5) * 60, got: 0 });
  }
}

// Is the circle (px, py, r) touching the rectangle?
function hitsBox(px, py, r, x0, y0, x1, y1) {
  const nx = Math.max(x0, Math.min(px, x1)), ny = Math.max(y0, Math.min(py, y1));
  return (px - nx) ** 2 + (py - ny) ** 2 < r * r;
}

// Did the butterfly bump the watering can, or its water?
function bumpsCan(f, lx, ly, r) {
  const s = canWidth() / CAN.w;
  for (const [x0, y0, x1, y1] of CAN.parts) {
    if (hitsBox(lx, ly, r, x0 * s, y0 * s, x1 * s, y1 * s)) return true;
  }
  const top = CAN.streamTop * s;
  return f.pour > 0 && hitsBox(lx, ly, r, CAN.streamX0 * s, top, CAN.streamX1 * s, top + f.pour);
}

// ------------------------------------------------------------
//  Did the butterfly bump this flower?
//  (lx, ly) is the butterfly's spot measured from the flower's head
// ------------------------------------------------------------
function bumps(o, lx, ly, r) {
  const s = FLOWER_SIZE / o.w;
  // the flower head is (about) an oval
  const cx = o.w / 2 * s, cy = o.headBottom / 2 * s;
  const rx = o.w / 2 * s * 0.85, ry = o.headBottom / 2 * s * 0.85;
  if (((lx - cx) / (rx + r)) ** 2 + ((ly - cy) / (ry + r)) ** 2 < 1) return true;
  // the stem is a long rectangle
  const nearX = Math.max(o.stemX0 * s, Math.min(lx, o.stemX1 * s));
  const nearY = Math.max(cy, ly);
  return (lx - nearX) ** 2 + (ly - nearY) ** 2 < r * r;
}

// ------------------------------------------------------------
//  Move everything one tiny step (60 times every second)
// ------------------------------------------------------------
// A new cloud: the computer picks which drawing, how big, how high, and which way it faces.
function makeCloud(x) {
  const pic = CLOUD_PICS[Math.random() < 0.5 ? 0 : 1];
  const scale = pic === CLOUD_PICS[0] ? 0.3 + Math.random() * 0.35 : 0.55 + Math.random() * 0.6;
  const w = pic.width / 2 * scale || 120;
  return { pic, scale, x: x ?? W + 10, y: 15 + Math.random() * 300,
           flip: Math.random() < 0.5, speed: 0.08 + w / 900 };   // bigger = closer = faster
}

function moveBackground() {
  if (mode === "playing") grassX += FLOWER_SPEED * GRASS_PARALLAX;
  if (fade < 1) fade = Math.min(1, fade + 1 / FADE_FRAMES);
  if (clouds.length === 0 && CLOUD_PICS[0].complete && CLOUD_PICS[0].width) {
    for (let i = 0; i < 4; i++) clouds.push(makeCloud(Math.random() * W));   // fill the sky to start
  }
  for (const c of clouds) c.x -= c.speed * CLOUD_SPEED;
  clouds = clouds.filter(c => c.x > -c.pic.width / 2 * c.scale);
  const rightmost = Math.max(-1e9, ...clouds.map(c => c.x + c.pic.width / 2 * c.scale));
  if (clouds.length && clouds.length < 5 && rightmost < W - 30 && Math.random() < 0.01) clouds.push(makeCloud());
  clouds.sort((a, b) => a.speed - b.speed);   // far (slow) clouds get drawn first, behind
}

function update() {
  clock++;
  const r = BIRD_SIZE * 0.3;   // the butterfly's "bump circle"
  moveBackground();

  if (mode === "ready") {
    bird.y = 300 + Math.sin(clock * 0.08) * 12;   // float gently while waiting
    return;
  }
  if (mode === "over") return;

  // 1. Gravity pulls the butterfly down
  bird.speed += GRAVITY;
  bird.y += bird.speed;
  if (bird.y < r) { bird.y = r; bird.speed = 0; }

  // 2. Slide the flowers left, and add new ones
  for (const f of flowers) f.x -= FLOWER_SPEED;
  flowers = flowers.filter(f => f.x > -columnWidth(f));
  const last = flowers[flowers.length - 1];
  if (!last || last.x + columnWidth(last) < W - (FLOWER_SPACING - FLOWER_SIZE)) addFlowers();

  // 3. The watering cans pour, a little more each step, until the water is halfway down
  for (const f of flowers) {
    if (!f.can) continue;
    const s = canWidth() / CAN.w;
    f.pour = Math.min(f.pour + WATER_SPEED, H / 2 - CAN.streamTop * s);
    // splashy drops fall off the end of the water
    if (f.pour > 0 && Math.random() < 0.5) {
      f.drops.push({ x: (CAN.streamX0 + Math.random() * (CAN.streamX1 - CAN.streamX0)) * s,
                     y: CAN.streamTop * s + f.pour, speed: 1 + Math.random() * 2, age: 0 });
    }
    for (const d of f.drops) { d.y += d.speed; d.speed += 0.3; d.age++; }
    f.drops = f.drops.filter(d => d.age < 15);
  }

  // 4. Score a point for each pair you get past
  for (const f of flowers) {
    if (!f.passed && f.x + columnWidth(f) < bird.x) {
      f.passed = true; score++;
      if (score % TIME_CHANGE_EVERY === 0) nextTimeOfDay();
    }
  }

  // 5. Pollen: slide along with the flowers, and get collected
  for (const p of pollens) {
    p.x -= FLOWER_SPEED;
    if (p.got) {
      p.got++;
      if (p.got % 7 === 0) {                       // CHOMP! a bite, and some crumbs fall
        const m = mouthSpot();
        for (let i = 0; i < 5; i++) crumbs.push({ x: m.x + 4, y: m.y, vx: Math.random() * 2 - 0.5, vy: -Math.random() * 2, age: 0 });
      }
      continue;
    }
    if (Math.hypot(p.x - bird.x, p.y - bird.y) < r + POLLEN_W / 2 && power === 0) {
      p.got = 1;
      p.fromX = p.x; p.fromY = p.y;                // remember where it was, to fly it to the mouth
      munchTimer = EAT_FRAMES;
      pollenCount++;
      if (pollenCount >= POLLEN_NEEDED) {          // the box is full: SUPER BUTTERFLY!
        pollenCount = 0;
        power = powerMax = Math.round(POWER_SECONDS * 60);
        pollens = pollens.filter(q => q.got);      // no pollen while invincible
      }
    }
  }
  pollens = pollens.filter(p => (p.got || p.x > -POLLEN_W) && p.got < EAT_FRAMES);
  for (const c of crumbs) { c.x += c.vx - FLOWER_SPEED * 0.5; c.y += c.vy; c.vy += 0.25; c.age++; }
  crumbs = crumbs.filter(c => c.age < 30);
  if (munchTimer > 0) munchTimer--;

  // 6. Crash checks: the ground, then every flower and watering can
  const hitGround = bird.y > H - r;
  let hitThing = false;
  for (const f of flowers) {
    const lx = bird.x - f.x;
    if (bumps(f.bottom, lx, bird.y - f.gapBottom, r)) hitThing = true;   // flower growing up
    if (f.can) {
      if (bumpsCan(f, lx, bird.y, r)) hitThing = true;                   // watering can and its water
    } else {
      if (bumps(f.top, lx, f.gapTop - bird.y, r)) hitThing = true;       // flower hanging down
    }
  }
  let crashed = hitGround || hitThing;
  if (power > 0) {
    crashed = false;                                // invincible! nothing can hurt you
    if (hitGround) { bird.y = H - r; bird.speed = FLAP_POWER * 0.9; wingTimer = 12; }   // boing!
    if (power > 1 || !hitThing) power--;            // never run out while inside a flower
  }
  if (crashed) {
    mode = "over";
    overTime = clock;
    if (score > best) { best = score; try { localStorage.setItem("flappy-best", best); } catch (e) {} }
  }
}

// ------------------------------------------------------------
//  Drawing
// ------------------------------------------------------------

// Draws a flower growing DOWN from (0,0), with its stem stretched to "length"
function drawFlower(o, length) {
  if (!o.img.complete) return;
  const s = FLOWER_SIZE / o.w;
  const fh = o.h * s;
  pen.drawImage(o.img, 0, 0, FLOWER_SIZE, fh);
  if (length > fh) {
    // stretch a slice of the stem to reach the edge of the screen
    pen.drawImage(o.img, 0, o.h - 40, o.w, 35, 0, fh - 2, FLOWER_SIZE, length - fh + 2);
  }
}

// Draws the watering can at the top of the screen, pouring its water
function drawCan(f) {
  const s = canWidth() / CAN.w;
  pen.save();
  pen.translate(f.x, 0);
  if (CAN.img.complete) pen.drawImage(CAN.img, 0, 0, CAN.w * s, CAN.h * s);

  if (f.pour > 0) {
    const x0 = CAN.streamX0 * s, x1 = CAN.streamX1 * s;
    const top = CAN.streamTop * s, end = top + f.pour;
    // The water's edges wiggle, and it gets a bit skinnier as it falls
    const left = [], right = [];
    for (let y = top; y < end; y += 4) left.push(y);
    left.push(end);
    const edge = (y, side) => {
      const wiggle = Math.sin(y * 0.12 - clock * 0.3) * 1.5;
      const skinny = (x1 - x0) * 0.2 * ((y - top) / (H / 2));
      return side < 0 ? x0 + skinny + wiggle : x1 - skinny + wiggle;
    };
    const bottomL = edge(end, -1), bottomR = edge(end, 1);
    pen.beginPath();
    left.forEach((y, i) => i ? pen.lineTo(edge(y, -1), y) : pen.moveTo(edge(y, -1), y));
    pen.quadraticCurveTo((bottomL + bottomR) / 2, end + (bottomR - bottomL) * 0.7, bottomR, end);
    for (let i = left.length - 1; i >= 0; i--) pen.lineTo(edge(left[i], 1), left[i]);
    pen.closePath();
    pen.fillStyle = WATER_BLUE;
    pen.fill();

    // black outline on the sides (starting below her drawn water) and the rounded bottom
    pen.strokeStyle = "black";
    pen.lineWidth = 2;
    const outlineFrom = 362 * s;
    for (const side of [-1, 1]) {
      pen.beginPath();
      left.filter(y => y >= outlineFrom).forEach((y, i) => i ? pen.lineTo(edge(y, side), y) : pen.moveTo(edge(y, side), y));
      pen.stroke();
    }
    pen.beginPath();
    pen.moveTo(bottomL, end);
    pen.quadraticCurveTo((bottomL + bottomR) / 2, end + (bottomR - bottomL) * 0.7, bottomR, end);
    pen.stroke();

    // shiny streaks sliding down so it looks like it's flowing
    pen.strokeStyle = "rgba(140,180,255,0.7)";
    pen.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const y = top + (clock * 3 + i * 23) % Math.max(1, f.pour);
      if (y + 10 > end) continue;
      const x = x0 + (x1 - x0) * (0.3 + 0.4 * ((i * 37) % 10) / 10);
      pen.beginPath(); pen.moveTo(x, y); pen.lineTo(x, y + 10); pen.stroke();
    }

    // splashing drops
    pen.fillStyle = WATER_BLUE;
    for (const d of f.drops) {
      pen.globalAlpha = 1 - d.age / 15;
      pen.beginPath(); pen.arc(d.x, d.y, 2.5, 0, Math.PI * 2); pen.fill();
    }
    pen.globalAlpha = 1;
  }
  pen.restore();
}

// It tips up when flying up, and nose-down when falling
function birdTilt() { return mode === "ready" ? 0 : Math.max(-0.5, Math.min(0.8, bird.speed * 0.06)); }

// Where the mouth is on the screen right now (the computer turns it with the tilt!)
function mouthSpot() {
  const w = BIRD_SIZE * 1.4, h = w * DRAWING_H / DRAWING_W, t = birdTilt();
  const mx = (MOUTH.x / DRAWING_W - 0.5) * w, my = (MOUTH.y / DRAWING_H - 0.5) * h;
  return { x: bird.x + mx * Math.cos(t) - my * Math.sin(t), y: bird.y + mx * Math.sin(t) + my * Math.cos(t) };
}

function drawButterfly() {
  const tilt = birdTilt();
  const w = BIRD_SIZE * 1.4;
  const h = w * DRAWING_H / DRAWING_W;

  // How open are the wings right now? (1 = wide open)
  let wingOpen = 1 - 0.1 * (0.5 + 0.5 * Math.sin(clock * 0.2));   // gentle flutter
  if (wingTimer > 0) {
    wingOpen = 1 - WING_FLAP * Math.sin(Math.PI * wingTimer / 12); // big flap
    wingTimer--;
  }

  pen.save();
  pen.translate(bird.x, bird.y);
  pen.rotate(tilt);
  if (wings.complete) {
    pen.save();
    pen.scale(1, wingOpen);   // squish the wings toward the body
    pen.drawImage(wings, -w / 2, -h / 2, w, h);
    pen.restore();
  }
  if (body.complete) pen.drawImage(body, -w / 2, -h / 2, w, h);

  // Blink every 2 to 5 seconds (the computer picks a random time)
  nextBlink--;
  if (nextBlink <= 0) { blinkTimer = 10; nextBlink = 120 + Math.random() * 180; }
  if (mode === "over") blinkTimer = 5;   // eyes squeezed shut after a crash
  if (blinkTimer > 0) {
    const closed = Math.sin(Math.PI * blinkTimer / 10);   // 0 = open, 1 = shut
    if (mode !== "over") blinkTimer--;
    for (const eye of EYES) {
      const ex = (eye.x / DRAWING_W - 0.5) * w, ey = (eye.y / DRAWING_H - 0.5) * h;
      const erx = eye.rx / DRAWING_W * w, ery = eye.ry / DRAWING_H * h;
      const lidBottom = ey - ery + 2 * ery * closed;
      pen.save();
      pen.beginPath();
      pen.ellipse(ex, ey, erx, ery, 0, 0, Math.PI * 2);
      pen.clip();
      pen.fillStyle = LID_COLOR;
      pen.fillRect(ex - erx, ey - ery - 1, erx * 2, lidBottom - (ey - ery) + 1);
      pen.restore();
      pen.strokeStyle = "black";
      pen.lineWidth = Math.max(1.5, w / 60);
      pen.beginPath();
      pen.ellipse(ex, lidBottom - ery * 0.3 * closed, erx * 0.95, ery * 0.3 * closed + 0.01, 0, 0.15 * Math.PI, 0.85 * Math.PI);
      pen.stroke();
    }
  }

  // Chewing: the mouth shuts and opens, shuts and opens... nom nom nom
  if (munchTimer > 0 && Math.floor(munchTimer / 4) % 2 === 0) {
    const mx = (MOUTH.x / DRAWING_W - 0.5) * w, my = (MOUTH.y / DRAWING_H - 0.5) * h;
    const mrx = MOUTH.rx / DRAWING_W * w, mry = MOUTH.ry / DRAWING_H * h;
    pen.fillStyle = LID_COLOR;
    pen.beginPath(); pen.ellipse(mx, my, mrx, mry, 0, 0, Math.PI * 2); pen.fill();
    pen.strokeStyle = "black";
    pen.lineWidth = Math.max(1.5, w / 60);
    pen.beginPath(); pen.ellipse(mx, my - mry * 0.5, mrx * 0.7, mry * 0.6, 0, 0.2 * Math.PI, 0.8 * Math.PI); pen.stroke();
  }
  pen.restore();
}

function bigText(text, y, size) {
  pen.font = `bold ${size}px sans-serif`;
  pen.textAlign = "center";
  pen.lineWidth = size / 6;
  pen.strokeStyle = "black";
  pen.fillStyle = "white";
  pen.strokeText(text, W / 2, y);
  pen.fillText(text, W / 2, y);
}

// A pollen coin waiting to be eaten: bobbing gently, with a soft glow so it's easy to spot
function drawPollen(p) {
  if (!POLLEN.complete || p.got) return;
  const y = p.y + Math.sin(clock * 0.1 + p.x * 0.05) * 4;
  const glowR = POLLEN_W * (0.75 + 0.08 * Math.sin(clock * 0.15 + p.x));
  const glow = pen.createRadialGradient(p.x, y, 0, p.x, y, glowR);
  glow.addColorStop(0, "rgba(255, 255, 200, 0.8)");
  glow.addColorStop(1, "rgba(255, 255, 200, 0)");
  pen.fillStyle = glow;
  pen.beginPath(); pen.arc(p.x, y, glowR, 0, Math.PI * 2); pen.fill();
  pen.drawImage(POLLEN, p.x - POLLEN_W / 2, y - POLLEN_H / 2, POLLEN_W, POLLEN_H);
}

// A pollen coin being eaten: it zooms into the mouth, then CHOMP, CHOMP, CHOMP!
// The computer erases a round bite from the coin each time.
const biteCanvas = document.createElement("canvas");
biteCanvas.width = POLLEN_W * 2; biteCanvas.height = Math.ceil(POLLEN_H * 2);
const bitePen = biteCanvas.getContext("2d");
function drawEaten(p) {
  if (!POLLEN.complete) return;
  const m = mouthSpot();
  const fly = Math.min(1, p.got / 6);               // first 6 pictures: fly to the mouth
  const ease = fly * (2 - fly);
  const size = 1 - 0.35 * ease;                     // shrinks a little on the way
  const x = p.fromX + (m.x + POLLEN_W * 0.5 * size - p.fromX) * ease;
  const y = p.fromY + (m.y - p.fromY) * ease;
  const bites = Math.floor(p.got / 7);              // 0, 1, 2, or 3 bites taken
  const bw = biteCanvas.width, bh = biteCanvas.height;
  bitePen.globalCompositeOperation = "source-over";
  bitePen.clearRect(0, 0, bw, bh);
  bitePen.drawImage(POLLEN, 0, 0, bw, bh);
  bitePen.globalCompositeOperation = "destination-out";   // erase = take a bite!
  for (let i = 0; i < bites; i++) {
    const bx = bw * (0.05 + 0.3 * i), by = bh * [0.45, 0.25, 0.7][i];
    bitePen.beginPath(); bitePen.arc(bx, by, bw * 0.3, 0, Math.PI * 2); bitePen.fill();
    bitePen.beginPath(); bitePen.arc(bx + bw * 0.04, by + bh * 0.3, bw * 0.17, 0, Math.PI * 2); bitePen.fill();
  }
  const w = POLLEN_W * size, h = POLLEN_H * size;
  pen.drawImage(biteCanvas, x - w / 2, y - h / 2, w, h);
}

function drawCrumbs() {
  pen.fillStyle = "#ffd21f";
  for (const c of crumbs) {
    pen.globalAlpha = 1 - c.age / 30;
    pen.beginPath(); pen.arc(c.x, c.y, 2.5, 0, Math.PI * 2); pen.fill();
  }
  pen.globalAlpha = 1;
}

// The glowing bubble around the butterfly while it's invincible.
// Part of it goes behind the butterfly, and the shiny ring goes in front.
function drawOrb(front) {
  if (power <= 0) return;
  if (power < 120 && Math.floor(power / 8) % 2) return;   // blinks when time is almost up
  const R = BIRD_SIZE * 0.85 + Math.sin(clock * 0.15) * 4;
  pen.save();
  pen.translate(bird.x, bird.y);
  if (!front) {
    const glow = pen.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.3);
    glow.addColorStop(0, "rgba(255, 250, 180, 0.15)");
    glow.addColorStop(0.7, "rgba(255, 215, 60, 0.45)");
    glow.addColorStop(1, "rgba(255, 215, 60, 0)");
    pen.fillStyle = glow;
    pen.beginPath(); pen.arc(0, 0, R * 1.3, 0, Math.PI * 2); pen.fill();
  } else {
    pen.shadowColor = "rgba(255, 230, 80, 1)";
    pen.shadowBlur = 18;
    pen.strokeStyle = "rgba(255, 255, 210, 0.9)";
    pen.lineWidth = 3;
    pen.beginPath(); pen.arc(0, 0, R, 0, Math.PI * 2); pen.stroke();
    pen.lineWidth = 4;                                     // a little shine on the bubble
    pen.beginPath(); pen.arc(0, 0, R * 0.75, -2.5 + Math.sin(clock * 0.05) * 0.2, -1.9 + Math.sin(clock * 0.05) * 0.2); pen.stroke();
  }
  pen.restore();
}

// The pollen box in the corner. It fills up one pollen at a time,
// then drains back down while the butterfly is invincible.
function drawPollenBox() {
  const x = 10, y = 10, w = 150, h = 42;
  const barX = x + 50, barY = y + 11, barW = w - 60, barH = h - 22;
  const fill = power > 0 ? power / powerMax : pollenCount / POLLEN_NEEDED;
  pen.save();
  pen.fillStyle = "rgba(255, 255, 255, 0.85)";
  pen.strokeStyle = "black";
  pen.lineWidth = 3;
  pen.beginPath(); pen.roundRect(x, y, w, h, 10); pen.fill(); pen.stroke();
  if (POLLEN.complete) pen.drawImage(POLLEN, x + 6, y + 8, POLLEN_W, POLLEN_H);
  pen.fillStyle = "#eee";
  pen.fillRect(barX, barY, barW, barH);
  if (power > 0) {                                  // glowing, draining bar
    pen.shadowColor = "rgba(255, 220, 60, 1)";
    pen.shadowBlur = 8 + Math.sin(clock * 0.3) * 6;
    pen.fillStyle = power < 120 && Math.floor(power / 8) % 2 ? "#fff3a0" : "#ffcc00";
  } else {
    pen.fillStyle = "#ffcc00";
  }
  pen.fillRect(barX, barY, barW * fill, barH);
  pen.shadowBlur = 0;
  pen.strokeStyle = "black";
  pen.lineWidth = 1;
  for (let i = 1; i < POLLEN_NEEDED; i++) {         // a little line for each of the 10 pollen
    const lx = barX + barW * i / POLLEN_NEEDED;
    pen.beginPath(); pen.moveTo(lx, barY); pen.lineTo(lx, barY + barH); pen.stroke();
  }
  pen.lineWidth = 2;
  pen.strokeRect(barX, barY, barW, barH);
  pen.restore();
}

function changeScene(name) {
  oldScene = scene;
  sceneName = name;
  scene = SCENES[name];
  fade = 0;
}

function nextTimeOfDay() {
  const drawn = TIME_OF_DAY.filter(n => SCENES[n]);   // only the ones she's drawn so far
  changeScene(drawn[(drawn.indexOf(sceneName) + 1) % drawn.length]);
}

// Clouds tinted for the time of day (made once, then remembered)
const tintedClouds = new Map();
function cloudPicture(pic, tint) {
  if (!tint) return pic;
  const key = pic.src + tint;
  if (!tintedClouds.has(key)) {
    const c = document.createElement("canvas");
    c.width = pic.width; c.height = pic.height;
    const p = c.getContext("2d");
    p.drawImage(pic, 0, 0);
    p.globalCompositeOperation = "source-atop";        // only color where the cloud is
    p.fillStyle = tint;
    p.fillRect(0, 0, c.width, c.height);
    tintedClouds.set(key, c);
  }
  return tintedClouds.get(key);
}

// Draws a picture over and over across the screen, every other copy
// flipped like a mirror, so the edges always match up perfectly.
function drawTiled(p, img, scroll, top, extra, onlyExtra) {
  const gw = img.width / 2, gh = img.height / 2;
  const offset = ((scroll % (2 * gw)) + 2 * gw) % (2 * gw);
  for (let k = 0; k * gw - offset < W; k++) {
    const x = k * gw - offset;
    p.save();
    if (k % 2) { p.translate(x + gw, 0); p.scale(-1, 1); } else p.translate(x, 0);
    if (!onlyExtra) p.drawImage(img, 0, top, gw + 0.5, gh);
    if (extra) extra(p);
    p.restore();
  }
}

// Twinkle, twinkle: each star softly glows and grows a tiny bit, each at its own time
function drawStars(p, sc) {
  sc.stars.forEach((st, i) => {
    if (!st.img.complete) return;
    const t = st.still ? 0.3 : 0.5 + 0.5 * Math.sin(clock * 0.05 + i * 1.7);   // the moon just glows
    const glowR = Math.max(st.w, st.h) * (0.55 + 0.1 * t);
    const glow = p.createRadialGradient(st.x, st.y, 0, st.x, st.y, glowR);
    glow.addColorStop(0, `rgba(255, 250, 190, ${0.25 + 0.35 * t})`);
    glow.addColorStop(1, "rgba(255, 250, 190, 0)");
    p.fillStyle = glow;
    p.beginPath(); p.arc(st.x, st.y, glowR, 0, Math.PI * 2); p.fill();
    const grow = 1 + 0.08 * t;
    p.drawImage(st.img, st.x - st.w * grow / 2, st.y - st.h * grow / 2, st.w * grow, st.h * grow);
  });
}

// Paints one whole time of day: sky, clouds, and land
function paintScene(p, sc) {
  // 1. The sky. Usually it never moves, but at night the whole starry sky drifts by.
  if (sc.sky.complete) {
    if (sc.skySpeed) {
      drawTiled(p, sc.sky, grassX * sc.skySpeed, 0);
      if (sc.nightShade) { p.fillStyle = sc.nightShade; p.fillRect(0, 0, W, H); }
      if (sc.stars) drawTiled(p, sc.sky, grassX * sc.skySpeed, 0, q => drawStars(q, sc), true);   // stars on top
    } else p.drawImage(sc.sky, 0, 0, W, H);
  }

  // 2. The clouds
  for (const c of clouds) {
    if (!c.pic.complete) continue;
    const w = c.pic.width / 2 * c.scale, h = c.pic.height / 2 * c.scale;
    p.save();
    p.translate(c.x + (c.flip ? w : 0), c.y);
    if (c.flip) p.scale(-1, 1);
    p.drawImage(cloudPicture(c.pic, sc.cloudTint), 0, 0, w, h);
    p.restore();
  }

  // 3. The land, sliding by underneath
  if (sc.land && sc.land.complete) drawTiled(p, sc.land, grassX, sc.landTop);
}

// While the time of day is changing, the computer paints BOTH scenes
// and slowly fades the new one in on top of the old one.
const fadeCanvas = document.createElement("canvas");
fadeCanvas.width = W; fadeCanvas.height = H;
const fadePen = fadeCanvas.getContext("2d");
function drawBackground() {
  if (fade >= 1 || !oldScene) { paintScene(pen, scene); return; }
  paintScene(pen, oldScene);
  fadePen.clearRect(0, 0, W, H);
  paintScene(fadePen, scene);
  pen.globalAlpha = fade * fade * (3 - 2 * fade);     // starts slow, speeds up, ends slow
  pen.drawImage(fadeCanvas, 0, 0);
  pen.globalAlpha = 1;
}

function draw() {
  pen.clearRect(0, 0, W, H);
  drawBackground();

  for (const f of flowers) {
    // bottom flower: grows up from the ground
    pen.save();
    pen.translate(f.x, f.gapBottom);
    drawFlower(f.bottom, H - f.gapBottom);
    pen.restore();
    if (f.can) {
      drawCan(f);
    } else {
      // top flower: flipped upside down, hanging from the sky
      pen.save();
      pen.translate(f.x, f.gapTop);
      pen.scale(1, -1);
      drawFlower(f.top, f.gapTop);
      pen.restore();
    }
  }

  for (const p of pollens) drawPollen(p);
  drawOrb(false);
  drawButterfly();
  for (const p of pollens) if (p.got) drawEaten(p);
  drawCrumbs();
  drawOrb(true);
  drawPollenBox();

  if (mode === "ready") {
    bigText("Ready?", 170, 56);
    bigText("Press SPACE or tap to fly!", 470, 24);
  } else {
    bigText(score, 80, 64);
  }
  if (mode === "over") {
    bigText("Oh no!", 230, 60);
    bigText(`Score: ${score}    Best: ${best}`, 290, 28);
    if (clock - overTime >= 40) bigText("Press SPACE to play again", 470, 24);
  }
}

// ------------------------------------------------------------
//  The settings screen: a slider for each knob.
//  Moving a slider changes the number while the game is running!
// ------------------------------------------------------------
const KNOBS = [
  { label: "🌍 Gravity", min: 0.1, max: 1.2, step: 0.05, get: () => GRAVITY, set: v => GRAVITY = v,
    hint: v => v < 0.2 ? "Floaty like the Moon 🌙" : v < 0.55 ? "Normal, like Earth" : v < 0.9 ? "Heavy!" : "Jupiter! 🪐" },
  { label: "💪 Flap strength", min: 3, max: 15, step: 0.5, get: () => -FLAP_POWER, set: v => FLAP_POWER = -v,
    hint: v => v < 5 ? "Tiny flaps" : v < 10 ? "Normal flaps" : "SUPER flaps!" },
  { label: "🦋 Butterfly size", min: 30, max: 150, step: 5, get: () => BIRD_SIZE, set: v => BIRD_SIZE = v,
    hint: v => v < 50 ? "Teeny tiny" : v < 100 ? "Just right" : "GIANT butterfly!" },
  { label: "🪽 Wing flap", min: 0, max: 1, step: 0.05, get: () => WING_FLAP, set: v => WING_FLAP = v,
    hint: v => v < 0.2 ? "Barely moving" : v < 0.8 ? "Normal flapping" : "Wings fold all the way" },
  { label: "🌸 Flower size", min: 60, max: 200, step: 5, get: () => FLOWER_SIZE, set: v => FLOWER_SIZE = v,
    hint: v => v < 90 ? "Little sprouts" : v < 150 ? "Normal flowers" : "Huge flowers!" },
  { label: "↕️ Gap size", min: 120, max: 350, step: 5, get: () => GAP, set: v => GAP = v,
    hint: v => v < 170 ? "Really hard!" : v < 240 ? "Normal" : "Easy peasy" },
  { label: "💨 Flower speed", min: 1, max: 7, step: 0.25, get: () => FLOWER_SPEED, set: v => FLOWER_SPEED = v,
    hint: v => v < 2 ? "Slow and gentle" : v < 3.5 ? "Normal" : v < 5 ? "Fast!" : "SUPER FAST! 🚀" },
  { label: "📏 Flower spacing", min: 150, max: 400, step: 10, get: () => FLOWER_SPACING, set: v => FLOWER_SPACING = v,
    hint: v => v < 200 ? "Packed close together" : v < 300 ? "Normal" : "Lots of room" },
  { label: "💧 Water pour speed", min: 0.25, max: 5, step: 0.25, get: () => WATER_SPEED, set: v => WATER_SPEED = v,
    hint: v => v < 1 ? "Slow drip" : v < 2.5 ? "Normal pour" : "Gushing! 🌊" },
  { label: "☁️ Cloud speed", min: 0, max: 10, step: 0.5, get: () => CLOUD_SPEED, set: v => CLOUD_SPEED = v,
    hint: v => v === 0 ? "Frozen in the sky" : v < 2 ? "Lazy drifting" : v < 5 ? "Windy day 💨" : "Hurricane! 🌪️" },
  { label: "⭐ Invincible time (seconds)", min: 3, max: 30, step: 1, get: () => POWER_SECONDS, set: v => POWER_SECONDS = v,
    hint: v => v < 6 ? "Quick sparkle" : v < 15 ? "Normal power-up" : "SUPER long! 🦋✨" },
  { label: "🌅 Time of day changes every", min: 2, max: 30, step: 1, get: () => TIME_CHANGE_EVERY, set: v => TIME_CHANGE_EVERY = v,
    hint: v => `${v} flowers` + (v < 6 ? " (super speedy days!)" : v > 20 ? " (looong days)" : "") },
];
const NORMAL = KNOBS.map(k => k.get());   // remember the starting numbers for "Back to normal"

function saveKnobs() {
  try { localStorage.setItem("flappy-knobs", JSON.stringify(KNOBS.map(k => k.get()))); } catch (e) {}
}
try {   // load the settings from last time, if there are any
  const saved = JSON.parse(localStorage.getItem("flappy-knobs"));
  if (Array.isArray(saved)) saved.slice(0, KNOBS.length).forEach((v, i) => { if (typeof v === "number") KNOBS[i].set(v); });
} catch (e) {}

const knobsBox = document.getElementById("knobs");
for (const k of KNOBS) {
  const div = document.createElement("div");
  div.className = "knob";
  div.innerHTML = `<label><span>${k.label}</span><span class="val"></span></label>
    <input type="range" min="${k.min}" max="${k.max}" step="${k.step}"><div class="hint"></div>`;
  const slider = div.querySelector("input");
  k.show = () => {
    slider.value = k.get();
    div.querySelector(".val").textContent = +k.get().toFixed(2);
    div.querySelector(".hint").textContent = k.hint(k.get());
  };
  slider.addEventListener("input", () => { k.set(Number(slider.value)); k.show(); saveKnobs(); });
  k.show();
  knobsBox.appendChild(div);
}
document.getElementById("reset").addEventListener("click", () => {
  KNOBS.forEach((k, i) => { k.set(NORMAL[i]); k.show(); });
  saveKnobs();
});
document.getElementById("gear").addEventListener("click", e => {
  document.getElementById("settings").classList.toggle("open");
  e.target.blur();   // so SPACE flaps instead of clicking the button again
});

// ------------------------------------------------------------
//  The game loop: move things in steady 1/60-second steps
//  (so the game runs the same speed on every computer), then draw.
// ------------------------------------------------------------
let lastTime = performance.now(), leftover = 0;
function gameLoop(now) {
  leftover += Math.min(now - lastTime, 100);
  lastTime = now;
  while (leftover >= 1000 / 60) { update(); leftover -= 1000 / 60; }
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
